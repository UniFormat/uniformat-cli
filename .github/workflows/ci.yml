name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    uses: UniFormat/.github/.github/workflows/rust-ci.yml@95bbdd08c862243584a2366d2e69b7ab3a4ae656
    with:
      repo: uniformat-cli
      siblings: uniformat-core uniformat-sas uniformat-conformance
      sibling-refs: '{"uniformat-core": "4075555dcf669e3c598c871ce280dda5ffc92234", "uniformat-sas": "b0a112fef120e5982cb35d4cd15e825b5713c0a5", "uniformat-conformance": "b75d53f3c0523b20500200083637f74aa1a702b9"}'
    secrets:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}
