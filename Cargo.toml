[package]
name = "uniformat-cli"
description = "Command line for the UniFormat family: inspect, count, export and convert tabular files through the common Arrow data model"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/UniFormat/uniformat-cli"
publish = false

[[bin]]
name = "uniformat"
path = "src/main.rs"

[features]
default = ["sas"]
# One feature per format crate: the CLI sits above the core and links the formats it is built with.
sas = ["dep:uniformat-sas-arrow"]

[dependencies]
# sibling repositories are cloned side by side (see README)
uniformat-core = { version = ">=0.1,<0.2", path = "../uniformat-core/crates/uniformat-core" }
uniformat-sas-arrow = { version = ">=0.1,<0.2", path = "../uniformat-sas/crates/uniformat-sas-arrow", optional = true }
arrow-array = "59.2"
arrow-schema = "59.2"
arrow-csv = "59.2"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
uniformat-testkit = { version = ">=0.1,<0.2", path = "../uniformat-conformance/crates/uniformat-testkit" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
